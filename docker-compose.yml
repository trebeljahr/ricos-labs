# Production Docker Compose. Coolify auto-detects ${VAR_NAME} syntax
# and creates UI fields for each. Do NOT expose ports here. Coolify's
# Traefik handles external routing.
#
# The image is built and pushed by .github/workflows/deploy.yml on
# every push to main. This file retains the exact pre-migration image
# solely for legacy rollback; future Image-app releases do not alter it.

services:
  client:
    image: ${CLIENT_IMAGE:-ghcr.io/trebeljahr/ricos-labs:latest}
    # Force a registry pull on every `docker compose up`. Without this,
    # Compose reuses whichever digest the Coolify host cached the last
    # time it saw `:latest`, so the deploy webhook restarts the container
    # on the PREVIOUS build while Coolify reports the deploy as finished.
    # The same shape kept sprite-tools and hatchkit docs on a May 2026
    # build through their 2026-09-28 redeploys.
    pull_policy: always
    environment:
      NEXT_PUBLIC_OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-}
      NEXT_PUBLIC_SENTRY_DSN: ${CLIENT_SENTRY_DSN:-}
      PORT: ${PORT:-6457}
    restart: unless-stopped
