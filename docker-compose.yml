# Production Docker Compose. Coolify auto-detects ${VAR_NAME} syntax
# and creates UI fields for each. Do NOT expose ports here. Coolify's
# Traefik handles external routing.
#
# The image is built and pushed by .github/workflows/deploy.yml on
# every push to main. This file retains the exact pre-migration image
# solely for legacy rollback; future Image-app releases do not alter it.

services:
  client:
    image: ghcr.io/trebeljahr/ricos-labs@sha256:64518dcff5d54e0f9e195e40b61ec8fdf49953d649f56c3d94539ba7442a7240
    pull_policy: always
    environment:
      NEXT_PUBLIC_OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-}
      NEXT_PUBLIC_SENTRY_DSN: ${CLIENT_SENTRY_DSN:-}
      PORT: ${PORT:-6457}
    restart: unless-stopped
