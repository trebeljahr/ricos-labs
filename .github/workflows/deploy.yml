# Every push to main builds the static export and uploads it as a new version
# of the Cloudflare Worker ricos-labs-client. An upload is not live. The deploy
# job then activates that version and checks that the public site serves the
# commit.
# RICOS_LABS_ROLLOUT_MODE: `automatic` activates on push; any other value only
# uploads, and a person activates with the `deploy` operation.
# Contract, routes and rollback: docs/RELEASE.md.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build and upload, activate the uploaded version of a commit, or verify a release
        type: choice
        options: [build, deploy, verify]
        default: build
      target_sha:
        description: Full commit SHA, required for deploy and verify
        type: string
        required: false
      version_id:
        description: Worker version id to activate (deploy only; needed for a commit older than the newest 10 uploads)
        type: string
        required: false

permissions:
  contents: read

# One group for every ref: the deploy job is the only writer of the active version.
concurrency:
  group: worker-release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WRANGLER_SEND_METRICS: "false"
  WORKER_CONFIG: packages/client/wrangler.jsonc

jobs:
  build:
    if: >-
      github.repository == 'trebeljahr/ricos-labs' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.operation == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    steps:
      - uses: actions/checkout@v5

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests and typecheck
        run: pnpm test && pnpm typecheck

      - name: Build the static export
        env:
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        run: |
          pnpm build
          node scripts/write-version.mjs packages/client/out

      # A Worker version serves only its own files. Tabs opened before this
      # release still ask for the hashed chunks of the releases before it.
      - name: Carry the hashed files of the two releases before this one
        run: node scripts/carry-static.mjs --site https://ricoslabs.com --out packages/client/out --release "$GITHUB_SHA"

      - name: Upload a version (not live yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          pnpm exec wrangler versions upload --config "$WORKER_CONFIG" --tag "$GITHUB_SHA" --message "Commit $GITHUB_SHA"
          version_id=$(node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
            const upload = lines.map((line) => JSON.parse(line)).find((entry) => entry.type === "version-upload");
            if (!/^[0-9a-f-]{36}$/.test(upload?.version_id ?? "")) process.exit(1);
            console.log(upload.version_id);
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "Uploaded $GITHUB_SHA as Worker version $version_id (not live)." >> "$GITHUB_STEP_SUMMARY"

  # On a push this runs only in automatic mode, after a successful upload of
  # that commit. A dispatch names a commit, and optionally its version id;
  # without one, the newest version tagged with the commit among the newest 10
  # uploads is used. That is also the rollback. Cloudflare activates only the
  # newest 100 uploads.
  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/ricos-labs' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.RICOS_LABS_ROLLOUT_MODE == 'automatic' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
      VERSION_ID: ${{ github.event_name == 'push' && needs.build.outputs.version_id || inputs.version_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Find the version uploaded for the commit
        id: version
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase commit SHA"; exit 1
          fi
          if [ -n "$VERSION_ID" ]; then
            if [[ ! "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "::error::version_id must be a Worker version UUID"; exit 1
            fi
          else
            # Wrangler lists only the newest 10 versions.
            pnpm exec wrangler versions list --config "$WORKER_CONFIG" --json > "$RUNNER_TEMP/versions.json" \
              || { echo "::error::wrangler versions list failed"; exit 1; }
            VERSION_ID=$(node -e '
              const versions = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const tagged = versions
                .filter((v) => v.annotations?.["workers/tag"] === process.argv[2])
                .sort((a, b) => String(b.metadata?.created_on).localeCompare(String(a.metadata?.created_on)));
              if (tagged.length) console.log(tagged[0].id);
            ' "$RUNNER_TEMP/versions.json" "$TARGET_SHA")
            if [ -z "$VERSION_ID" ]; then
              echo "::error::None of the newest 10 versions is tagged $TARGET_SHA. Pass version_id (the build summary names it), or run the build operation on that commit."
              exit 1
            fi
          fi
          echo "id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Activate the version
        env:
          ID: ${{ steps.version.outputs.id }}
        run: |
          pnpm exec wrangler versions deploy "$ID@100%" --config "$WORKER_CONFIG" --yes --message "Release $TARGET_SHA"
          echo "Activated Worker version $ID for $TARGET_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the serving commit
        run: node scripts/verify-release.mjs "$TARGET_SHA"

  # This only observes public HTTP responses.
  verify:
    if: >-
      github.repository == 'trebeljahr/ricos-labs' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify the serving commit
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"
